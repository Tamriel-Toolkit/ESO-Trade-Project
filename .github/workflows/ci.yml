name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  automation:
    name: Automation regression tests
    permissions:
      contents: read
      pull-requests: read
      issues: read
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node --test .agents/scripts/test_*.js
      - name: Validate generated queue PR boundary
        if: github.event_name == 'pull_request' && github.head_ref == 'automation/priority-queue'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .agents/scripts/validate_queue_pr.js

  backend-and-pipeline:
    name: Backend API & Data Pipeline Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Setup Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/data-pipeline/requirements.txt'

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Python Dependencies
        working-directory: backend/data-pipeline
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          pip install -r test-requirements.txt

      - name: Run Backend Integration Test Suite
        working-directory: backend
        env:
          NODE_ENV: test
          DB_PATH: ${{ runner.temp }}/eso-ci-sentinel.db
          BLAKE_API_TOKEN: ci_ambient_blake_token
          DEMO_API_TOKEN: ci_ambient_demo_token
          ESOTRADE_AUTH_TOKEN: ci_ambient_sync_token
        run: |
          mkdir -p exports
          printf 'CI-SENTINEL-DB-BYTES-DO-NOT-OPEN' > "$DB_PATH"
          printf 'CI-WORKSPACE-CATALOG-SENTINEL-DO-NOT-OPEN' > exports/eso_catalog.db
          touch -d "2025-01-15T12:00:00Z" "$DB_PATH" exports/eso_catalog.db
          printf 'DB_PATH=%s\nBLAKE_API_TOKEN=ci_dotenv_blake_token\nESOTRADE_AUTH_TOKEN=ci_dotenv_sync_token\n' "$DB_PATH" > .env
          SENTINEL_STATE_BEFORE="$(sha256sum "$DB_PATH" exports/eso_catalog.db && stat -c '%n:%Y:%y' "$DB_PATH" exports/eso_catalog.db)"
          npm test
          SENTINEL_STATE_AFTER="$(sha256sum "$DB_PATH" exports/eso_catalog.db && stat -c '%n:%Y:%y' "$DB_PATH" exports/eso_catalog.db)"
          test "$SENTINEL_STATE_BEFORE" = "$SENTINEL_STATE_AFTER"

      - name: Run Isolated Python Regression Suites
        working-directory: backend/data-pipeline
        env:
          DB_PATH: ${{ runner.temp }}/eso-ci-sentinel.db
          ESOTRADE_AUTH_TOKEN: ci_ambient_sync_token
        run: |
          SENTINEL_STATE_BEFORE="$(sha256sum "$DB_PATH" ../exports/eso_catalog.db && stat -c '%n:%Y:%y' "$DB_PATH" ../exports/eso_catalog.db)"
          python -B -m unittest -v test_db_queries test_ttl_purge test_catalog test_watcher test_parser_failures test_listing_lifecycle test_addon_lifecycle test_fetch_and_ingest
          SENTINEL_STATE_AFTER="$(sha256sum "$DB_PATH" ../exports/eso_catalog.db && stat -c '%n:%Y:%y' "$DB_PATH" ../exports/eso_catalog.db)"
          test "$SENTINEL_STATE_BEFORE" = "$SENTINEL_STATE_AFTER"
          rm -f ../exports/eso_catalog.db ../.env "$DB_PATH"

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Run Frontend Regression Tests
        working-directory: frontend
        run: npm test

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: |
          npm run build

  ci-status:
    name: CI Status Gate
    needs: [automation, backend-and-pipeline, frontend-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Status of All Jobs
        run: |
          if [ "${{ needs.automation.result }}" != "success" ] || [ "${{ needs.backend-and-pipeline.result }}" != "success" ] || [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "CI Workflow Failed! Backend: ${{ needs.backend-and-pipeline.result }}, Frontend: ${{ needs.frontend-build.result }}"
            exit 1
          fi
          echo "All CI checks passed successfully!"
