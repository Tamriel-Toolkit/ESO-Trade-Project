name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-and-pipeline:
    name: Backend API & Data Pipeline Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'backend/data-pipeline/requirements.txt'

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Install Python Dependencies
        working-directory: backend/data-pipeline
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run Backend Integration Test Suite
        working-directory: backend
        env:
          NODE_ENV: test
        run: |
          node data-pipeline/test_api_endpoints.js

      - name: Run Python SQLite Database Query Validation
        working-directory: backend/data-pipeline
        run: |
          python test_db_queries.py

      - name: Run Watcher Feedback Loop Regression Tests
        working-directory: backend/data-pipeline
        run: |
          python test_watcher.py

  frontend-build:
    name: Frontend Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          else
            npm install
          fi

      - name: Build Frontend Production Bundle
        working-directory: frontend
        run: |
          npm run build

  ci-status:
    name: CI Status Gate
    needs: [backend-and-pipeline, frontend-build]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check Status of All Jobs
        run: |
          if [ "${{ needs.backend-and-pipeline.result }}" != "success" ] || [ "${{ needs.frontend-build.result }}" != "success" ]; then
            echo "CI Workflow Failed! Backend: ${{ needs.backend-and-pipeline.result }}, Frontend: ${{ needs.frontend-build.result }}"
            exit 1
          fi
          echo "All CI checks passed successfully!"
