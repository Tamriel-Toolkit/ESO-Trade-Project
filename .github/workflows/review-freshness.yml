name: Invalidate stale AI reviews
on:
  workflow_run:
    workflows: [CI]
    types: [requested, completed]
permissions:
  contents: read
  pull-requests: read
  issues: write
concurrency:
  group: ai-review-freshness
  cancel-in-progress: false
jobs:
  invalidate:
    if: contains(fromJSON('["pull_request", "push"]'), github.event.workflow_run.event) && github.event.workflow_run.repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Always use trusted default-branch code. Never download upstream artifacts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .agents/scripts/run_pr_review.js stale
