name: Sync Priority Queue
on:
  issues:
    types: [closed, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: sync-priority-queue
  cancel-in-progress: false
jobs:
  sync-queue:
    if: github.event_name != 'issues' || github.event.action != 'edited' || github.event.issue.number == 35
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Reconcile live roadmap and update one generated mirror PR
        env:
          GITHUB_TOKEN: ${{ secrets.QUEUE_PR_TOKEN || github.token }}
        run: node .agents/scripts/publish_queue.js
