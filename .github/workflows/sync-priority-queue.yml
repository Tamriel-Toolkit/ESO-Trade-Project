name: Sync Priority Queue

on:
  pull_request:
    types: [closed]
    branches: [main]
  issues:
    types: [closed]
  workflow_dispatch:

concurrency:
  group: sync-priority-queue
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  sync-queue:
    # Only run for pull requests if they were actually merged (not closed without merging)
    if: (github.event_name != 'pull_request' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Queue Synchronization
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TRACKING_ISSUE_NUMBER: 35
          PR_BODY: ${{ github.event.pull_request.body || '' }}
          PR_TITLE: ${{ github.event.pull_request.title || '' }}
        run: |
          node .agents/scripts/sync_priority_queue.js

      - name: Commit and Push Updated PRIORITY_QUEUE.md (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .agents/PRIORITY_QUEUE.md
          if git diff --staged --quiet; then
            echo "No changes to .agents/PRIORITY_QUEUE.md. Skipping commit."
            exit 0
          fi

          git commit -m "chore(queue): auto-sync priority matrix on issue/PR merge [skip ci]"

          # Push with bounded retries and rebase against latest origin/main
          MAX_RETRIES=3
          RETRY_COUNT=0
          PUSH_SUCCESS=false

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            echo "Attempting git push origin main (attempt $((RETRY_COUNT + 1)) of $MAX_RETRIES)..."
            if git push origin main; then
              PUSH_SUCCESS=true
              echo "Successfully pushed updated PRIORITY_QUEUE.md to main."
              break
            fi

            echo "[WARN] Push failed. Fetching and rebasing against latest origin/main..."
            RETRY_COUNT=$((RETRY_COUNT + 1))
            git fetch origin main
            if ! git rebase origin/main; then
              echo "[FATAL] Rebase conflict encountered while synchronizing PRIORITY_QUEUE.md. Aborting rebase."
              git rebase --abort || true
              exit 1
            fi
            sleep $((RETRY_COUNT * 2))
          done

          if [ "$PUSH_SUCCESS" = false ]; then
            echo "[FATAL] Failed to push PRIORITY_QUEUE.md after $MAX_RETRIES attempts."
            exit 1
          fi
