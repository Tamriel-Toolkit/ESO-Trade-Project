name: Sync Priority Queue
on:
  issues:
    types: [closed, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 12 * * *'
permissions:
  contents: write
  issues: write
  pull-requests: write
concurrency:
  group: sync-priority-queue
  cancel-in-progress: false
jobs:
  sync-queue:
    if: github.event_name != 'issues' || github.event.action != 'edited' || github.event.issue.number == 35
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Reconcile live roadmap and update one generated mirror PR
        env:
          GITHUB_TOKEN: ${{ secrets.QUEUE_PR_TOKEN || github.token }}
        run: node .agents/scripts/publish_queue.js
