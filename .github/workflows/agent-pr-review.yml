name: Agentic PR Review
on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Open pull request number (any author, including forks)'
        required: true
        type: number
permissions: {}
concurrency:
  group: ai-review-${{ github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false
jobs:
  collect:
    if: >-
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.body == '/review') ||
      (github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Authorize requester and collect immutable PR data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: node .agents/scripts/run_pr_review.js collect
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: review-snapshot
          path: review-data/snapshot.json
          retention-days: 1
          if-no-files-found: error
  review:
    needs: collect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-snapshot
          path: review-data
      - name: Review data without tools or a GitHub write token
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL || 'gemini-3.8-flash' }}
        run: node .agents/scripts/run_pr_review.js review
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: review-result
          path: review-data/result.json
          retention-days: 1
          if-no-files-found: error
  publish:
    needs: [collect, review]
    if: always() && needs.collect.result == 'success' && needs.review.result != 'cancelled' && needs.review.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-snapshot
          path: review-data
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: review-result
          path: review-data
      - name: Validate, recheck revision and publish advisory findings
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .agents/scripts/run_pr_review.js publish
