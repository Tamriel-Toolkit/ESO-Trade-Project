version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      development:
        dependency-type: development
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      development:
        dependency-type: development
  - package-ecosystem: pip
    directory: /backend/data-pipeline
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
